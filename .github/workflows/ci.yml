# ==============================================================================
# GITHUB ACTIONS CONTINUOUS INTEGRATION (CI) PIPELINE
# File: .github/workflows/ci.yml
# ==============================================================================

name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Concurrency Control: Prevents redundant workflow builds on active branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # Permitted to upload Trivy security scans to CodeQL Security tab

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: BACKEND QUALITY ASSURANCE & UNIT TESTS
  # ----------------------------------------------------------------------------
  backend-qa:
    name: Backend QA (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc python3-dev libcairo2-dev pkg-config

      - name: Install Quality & App Requirements
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.17.0" mypy pytest requests
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Execute Ruff Code Linting
        run: ruff check backend/app

      - name: Execute Ruff Formatting Check
        run: ruff format --check backend/app

      - name: Execute Mypy Static Type Analysis
        run: |
          # Use explicit-package-bases so mypy resolves backend.app.api.assessment
          # and backend.app.schemas.assessment as distinct modules
          MYPYPATH=. mypy --ignore-missing-imports --explicit-package-bases backend/app

      - name: Execute Backend Unit Tests
        working-directory: backend
        env:
          ENVIRONMENT: development
          DEMO_MODE: "false"
          ENABLE_DEMO_AUTH: "true"
          PYTHONPATH: .
        run: pytest -q tests

  # ----------------------------------------------------------------------------
  # JOB 2: FRONTEND QUALITY ASSURANCE & PRODUCTION BUILD
  # ----------------------------------------------------------------------------
  frontend-qa:
    name: Frontend QA (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Execute ESLint Code Scan
        working-directory: frontend
        run: npm run lint

      - name: Execute TypeScript Type Validation
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Compile Production Web Bundle (Turbopack)
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # JOB 3: SECURITY VULNERABILITY SCANNING
  # ----------------------------------------------------------------------------
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [backend-qa, frontend-qa]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      # Pin to aquasecurity/trivy-action@v0.35.0 (commit SHA) for reproducible installs.
      # Do not use @master — it has caused tool-install failures and missing SARIF output.
      - name: Run Trivy Filesystem Security Scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Upload Scan Results to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: "trivy-results.sarif"

  # ----------------------------------------------------------------------------
  # JOB 4: DOCKER COMPOSE INTEGRATION & E2E TEST RUN
  # ----------------------------------------------------------------------------
  integration-test:
    name: Docker Integration & E2E Validation
    runs-on: ubuntu-latest
    needs: [backend-qa, frontend-qa]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Docker Layer Cache (Buildx)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Setup Ollama Volume Caching
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-${{ hashFiles('backend/app/core/config.py') }}
          restore-keys: |
            ${{ runner.os }}-ollama-

      - name: Spin Up Docker Compose Network (Offline/Fallback Stack)
        env:
          REQUIRE_POSTGRES: "true"
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@db:5432/aireadiness"
          USE_OLLAMA: "true"
          ALLOW_OLLAMA_FALLBACK: "true"
          DEMO_MODE: "false"
          ALLOW_HEURISTIC_FALLBACK: "false"
          ENABLE_DEMO_AUTH: "true"
          ENABLE_DEMO_WORKSPACE: "true"
          OLLAMA_REASONING_MODEL: phi3.5:latest
          OLLAMA_STRUCTURED_MODEL: phi3.5:latest
          OLLAMA_LIGHTWEIGHT_MODEL: phi3.5:latest
        run: |
          docker compose build
          # Start database + model server first; migrate before app traffic.
          docker compose up -d db ollama

      - name: Poll PostgreSQL pgvector Health Gate
        run: |
          echo "Waiting for PostgreSQL database container to report healthy..."
          attempts=0
          until [ $(docker inspect --format='{{json .State.Health.Status}}' aireadiness_db) == "\"healthy\"" ] || [ $attempts -gt 15 ]; do
            echo " - Database status: $(docker inspect --format='{{json .State.Health.Status}}' aireadiness_db 2>/dev/null || echo 'starting'). Waiting 3s..."
            sleep 3
            attempts=$((attempts+1))
          done
          
          if [ $attempts -gt 15 ]; then
            echo "[FAIL] Database healthcheck timeout!"
            docker compose logs db
            exit 1
          fi
          echo "[PASS] PostgreSQL pgvector is fully online and healthy."

      - name: Execute Alembic Migrations Against PostgreSQL
        env:
          REQUIRE_POSTGRES: "true"
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@db:5432/aireadiness"
        run: |
          echo "Migrating the intended PostgreSQL database (no SQLite fallback, no stamp)..."
          docker compose run --rm --no-deps \
            -e REQUIRE_POSTGRES=true \
            -e DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/aireadiness \
            -e POSTGRES_HOST=db \
            backend alembic upgrade head

      - name: Start Backend and Frontend Services
        env:
          REQUIRE_POSTGRES: "true"
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@db:5432/aireadiness"
          USE_OLLAMA: "true"
          ALLOW_OLLAMA_FALLBACK: "true"
          DEMO_MODE: "false"
          ALLOW_HEURISTIC_FALLBACK: "false"
          ENABLE_DEMO_AUTH: "true"
          ENABLE_DEMO_WORKSPACE: "true"
          OLLAMA_REASONING_MODEL: phi3.5:latest
          OLLAMA_STRUCTURED_MODEL: phi3.5:latest
          OLLAMA_LIGHTWEIGHT_MODEL: phi3.5:latest
        run: |
          docker compose up -d backend frontend

      - name: Poll Local Ollama Health Gate
        run: |
          echo "Waiting for Ollama model server container to respond..."
          attempts=0
          until curl -s -f http://localhost:11434/api/tags > /dev/null || [ $attempts -gt 15 ]; do
            echo " - Ollama is not responding yet. Waiting 3s..."
            sleep 3
            attempts=$((attempts+1))
          done
          
          if [ $attempts -gt 15 ]; then
            echo "[FAIL] Ollama connection timeout!"
            docker compose logs ollama
            exit 1
          fi
          echo "[PASS] Ollama is online."

      - name: Cache/Pull Ollama Lightweight Model for CI Check
        run: |
          # Pull the lightest model for testing speed in the CI network
          echo "Pulling lightweight model (phi3.5:latest) inside the container..."
          docker compose exec -T ollama ollama pull phi3.5:latest
          docker compose exec -T ollama ollama list

      - name: Verify readyz Reports PostgreSQL
        run: |
          echo "Waiting for backend /readyz with dialect=postgresql..."
          attempts=0
          until curl -sf http://localhost:8000/readyz > /tmp/readyz.json || [ $attempts -gt 30 ]; do
            echo " - Backend not ready yet. Waiting 3s..."
            sleep 3
            attempts=$((attempts+1))
          done
          if [ $attempts -gt 30 ]; then
            echo "[FAIL] Backend readiness timeout!"
            docker compose logs backend
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          data = json.load(open("/tmp/readyz.json"))
          print("readyz:", data)
          assert data.get("status") == "ready", data
          assert data.get("dialect") == "postgresql", data
          driver = (data.get("driver") or "")
          assert "psycopg" in driver, data
          print("[PASS] readyz confirms PostgreSQL via", driver)
          PY

      - name: Run E2E Test Suite Programmatic Assertions
        run: |
          echo "Installing E2E test dependencies on runner..."
          pip install requests pypdf python-docx python-pptx --quiet
          echo "Executing test_runner.py content-level verification..."
          python3 tests/e2e/test_runner.py

      - name: Tear Down Docker Compose Services
        if: always()
        run: |
          docker compose down --volumes
