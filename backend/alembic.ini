[alembic]
script_location = alembic
prepend_sys_path = .
# Overridden at runtime by alembic/env.py (settings.DATABASE_URL / DATABASE_URL).
# Do not rely on this placeholder for Docker/CI — REQUIRE_POSTGRES must use PostgreSQL.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
