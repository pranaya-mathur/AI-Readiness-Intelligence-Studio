version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: aireadiness_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aireadiness
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aireadiness_backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aireadiness
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - SECRET_KEY=super-secret-key-change-in-production
      - USE_OLLAMA=false
      - GROQ_API_KEY=
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: aireadiness_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aireadiness_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
  ollama_data:
