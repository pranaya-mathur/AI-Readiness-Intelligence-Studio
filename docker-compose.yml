version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: aireadiness_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aireadiness
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aireadiness_backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-aireadiness}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
      - USE_OLLAMA=${USE_OLLAMA:-false}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_REASONING_MODEL=${OLLAMA_REASONING_MODEL:-qwen2.5:7b}
      - OLLAMA_STRUCTURED_MODEL=${OLLAMA_STRUCTURED_MODEL:-llama3:8b}
      - OLLAMA_LIGHTWEIGHT_MODEL=${OLLAMA_LIGHTWEIGHT_MODEL:-phi3.5:latest}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: aireadiness_ollama
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_MODEL_MOUNT_PATH:-ollama_data}:/root/.ollama
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aireadiness_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
  ollama_data:
